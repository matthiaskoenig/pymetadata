[tox]
envlist = ty, py3.{11,12,13,14}

[testenv]
package = wheel
wheel_build_env = .pkg
deps =
    pytest
commands =
    pytest

[testenv:ty]
# the optional ontology dependencies are needed to resolve the imports of
# `pymetadata.ontologies._ontology_builder`
extras =
    ontology
passenv =
    TY_OUTPUT_FORMAT
deps =
    ty
    pytest
commands =
    ty check
