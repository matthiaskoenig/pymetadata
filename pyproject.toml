[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymetadata"
dynamic = ["version"]
description = "pymetadata are python utilities for working with metadata."
readme = "README.md"
requires-python = ">=3.11"
authors = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
maintainers = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: Implementation :: CPython",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
	"modeling",
	"standardization",
	"COMBINE",
	"metadata",
	"archive",
	"annotation",
]
dependencies = [
	"rich>=14.2.0",
	"requests>=2.32.5",
	"pronto>=2.7.3",
	"jinja2>=3.1.6",
	"xmltodict>=1.0.2",
	"pydantic>=2.12.5",
]

[project.optional-dependencies]
dev = [
    "bump-my-version>=1.5.1",
	"ruff>=0.16.6",
	"pre-commit>=4.6.2",
	"ty>=0.0.78",
    "tox>=4.61.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "quartodoc>=0.11.1",
]

[project_urls]
Homepage = "https://github.com/matthiaskoenig/pymetadata"
Repository = "https://github.com/matthiaskoenig/pymetadata"
Documentation = "https://github.com/matthiaskoenig/pymetadata"
Issues = "https://github.com/matthiaskoenig/pymetadata/issues"
Download = "https://pypi.org/project/pymetadata"

[tool.hatch.version]
path = "./src/pymetadata/__init__.py"

[tool.ty.environment]
# first-party modules live in the src layout; the checked python version is
# inferred from `project.requires-python` (i.e. the oldest supported version)
root = ["./src"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
# warnings are failures: keep the codebase free of any diagnostic
error-on-warning = true
