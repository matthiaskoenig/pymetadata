[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymetadata"
dynamic = ["version"]
description = "pymetadata are python utilities for working with metadata."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
maintainers = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: Implementation :: CPython",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
	"modeling",
	"standardization",
	"COMBINE",
	"metadata",
	"archive",
	"annotation",
]
dependencies = [
	"rich>=15.0.0",
	"requests>=2.34.2",
	"pydantic>=2.13.5",
]

[project.optional-dependencies]
# reading ontologies and generating the modules in `pymetadata.ontologies`,
# see `pymetadata.ontologies._ontology_builder`. Not needed to use the terms.
ontology = [
    "pronto>=2.7.3",
]
dev = [
    "pymetadata[ontology]",
    "bump-my-version>=1.5.1",
	"ruff>=0.16.6",
	"pre-commit>=4.6.2",
	"ty>=0.0.78",
    "tox>=4.61.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "zensical>=0.0.60",
    "mkdocstrings-python>=2.0.8",
]

[project.urls]
Homepage = "https://matthiaskoenig.github.io/pymetadata"
Documentation = "https://matthiaskoenig.github.io/pymetadata"
Repository = "https://github.com/matthiaskoenig/pymetadata"
Issues = "https://github.com/matthiaskoenig/pymetadata/issues"
Changelog = "https://github.com/matthiaskoenig/pymetadata/tree/develop/release-notes"
Download = "https://pypi.org/project/pymetadata"

[tool.hatch.version]
path = "./src/pymetadata/__init__.py"

[tool.hatch.build]
# work in progress, see `pymetadata.oven`; not shipped
exclude = [
    "src/pymetadata/oven",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
# first-party modules live in the src layout; the checked python version is
# inferred from `project.requires-python` (i.e. the oldest supported version)
root = ["./src"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
# warnings are failures: keep the codebase free of any diagnostic
error-on-warning = true
