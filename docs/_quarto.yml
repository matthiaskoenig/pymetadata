project:
  type: website
  output-dir: ../_site

  render:
    - "*.qmd"
    - "*.md"
    - "!tests/"
    - "!release-notes/"
    - "!src/"

website:
  title: "pymetadata"
  "description": "Python utilities for working with metadata and COMBINE archives"
  favicon: images/favicon/favicon.ico
  site-url: https://matthiaskoenig.github.io/pymetadata
  open-graph: true
  page-navigation: true
  bread-crumbs: true
  repo-url: https://github.com/matthiaskoenig/pymetadata
  repo-branch: develop
  repo-subdir: docs
  repo-link-target: _blank
  repo-actions: [ edit, source, issue ]

  sidebar:
    style: "docked"
    type: "dark"
    search: true
    contents:
       - index.qmd
       - text: "Installation"
         href: installation.qmd

       - section: "User guide"
         contents:
          - text: "COMBINE archives"
            href: omex.qmd
          - text: "Annotations"
            href: annotations.qmd

       - section: "API Reference"
         contents:
          - text: "Overview"
            href: api/index.qmd

          - section: "pymetadata"
            contents:
              - text: "cache"
                href: api/cache.qmd
              - text: "chebi"
                href: api/chebi.qmd
              - text: "console"
                href: api/console.qmd
              - text: "log"
                href: api/log.qmd
              - text: "omex"
                href: api/omex.qmd
              - text: "unichem"
                href: api/unichem.qmd
              - text: "webservice"
                href: api/webservice.qmd

          - section: "pymetadata.core"
            contents:
              - text: "annotation"
                href: api/core.annotation.qmd
              - text: "creator"
                href: api/core.creator.qmd
              - text: "xref"
                href: api/core.xref.qmd

          - section: "pymetadata.identifiers"
            contents:
              - text: "miriam"
                href: api/identifiers.miriam.qmd
              - text: "registry"
                href: api/identifiers.registry.qmd

          - section: "pymetadata.ontologies"
            contents:
              - text: "ols"
                href: api/ontologies.ols.qmd
              - text: "ontology"
                href: api/ontologies.ontology.qmd

       - section: "Contributing"
         contents:
          - href: development.qmd

    tools:
      - icon: github
        menu:
          - text: Source Code
            href: https://github.com/matthiaskoenig/pymetadata
          - text: Report a Bug
            href: https://github.com/matthiaskoenig/pymetadata/issues

  page-footer:
    left: "Copyright 2019-2026, Matthias König, [https://livermetabolism.com](https://livermetabolism.com)"
    right:
      - icon: github
        href: https://github.com/matthiaskoenig
      - icon: linkedin
        href: https://www.linkedin.com/in/matthias-koenig/
      - icon: orcid
        href: https://orcid.org/0000-0003-1725-179X

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css:
      - api/_styles-quartodoc.css
    toc: true


# tell quarto to read the generated sidebar
metadata-files:
  - api/_sidebar.yml

quartodoc:
  # the name used to import the package you want to create reference docs for
  package: pymetadata
  render_interlinks: true
  parser: google  # google, sphinx, numpy

  # write sidebar and style data
  sidebar: api/_sidebar.yml
  css: api/_styles-quartodoc.css
  version: 0.5.12
  dir: api

  sections:
    - title: pymetadata
      desc: |
        Top level modules. The ontology terms of SBO, KISAO, ECO and PBPKO are
        generated enums, see [Annotations](../annotations.qmd#ontology-enums).
      contents:
        - name: cache
        - name: chebi
        - name: console
        - name: log
        - name: omex
        - name: unichem
        - name: webservice

    - subtitle: pymetadata.core
      desc: Core data structures for annotations, creators and cross references.
      contents:
        - name: core.annotation
        - name: core.creator
        - name: core.xref

    - subtitle: pymetadata.identifiers
      desc: MIRIAM qualifiers and the identifiers.org registry.
      contents:
        - name: identifiers.miriam
        - name: identifiers.registry

    - subtitle: pymetadata.ontologies
      desc: Ontology lookup service and generation of the enum modules.
      contents:
        - name: ontologies.ols
        - name: ontologies.ontology

filters:
  - interlinks

interlinks:
  sources: {}
